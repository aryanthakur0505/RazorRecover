services:
  - type: web
    name: razorrecover-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Razorpay credentials are no longer app-wide env vars — each merchant connects their own
      # account from inside the app (Policies & Audit → Razorpay Connection). See .env.example.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SESSION_SECRET
        generateValue: true
